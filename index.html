<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Monitoring Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Temperature Monitoring Dashboard</h1>
        <p>Real-Time Temperature Monitoring System</p>
    </header>

    <main class="dashboard">

        <section class="card">
            <h2>Current Temperature</h2>
            <h1 id="temperature">32°C</h1>
            <p id="status">Normal Temperature</p>
        </section>

        <section class="card">
            <h2>Alert Threshold</h2>
            <h1>40°C</h1>
            <p>Maximum Safe Temperature</p>
        </section>

        <section class="card">
            <h2>System Status</h2>
            <h1 id="systemStatus">NORMAL</h1>
            <p>Monitoring Active</p>
        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
